<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A3D62" />
      <stop offset="50%" stop-color="#0E4B75" />
      <stop offset="100%" stop-color="#122B3D" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Sheet Grid Header Backdrop -->
  <rect x="80" y="80" width="352" height="352" rx="32" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" filter="url(#shadow)" />
  <line x1="80" y1="160" x2="432" y2="160" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3" />
  <line x1="190" y1="80" x2="190" y2="432" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6" />
  <line x1="310" y1="80" x2="310" y2="432" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Header dots -->
  <circle cx="120" cy="120" r="10" fill="#38BDF8" />
  <circle cx="150" cy="120" r="10" fill="#34D399" />
  <circle cx="180" cy="120" r="10" fill="#FBBF24" />

  <!-- Growth Analytics Chart Bars -->
  <!-- Bar 1 -->
  <rect x="120" y="270" width="60" height="130" rx="14" fill="url(#bar1)" />
  <!-- Bar 2 -->
  <rect x="226" y="200" width="60" height="200" rx="14" fill="url(#bar2)" />
  <!-- Bar 3 -->
  <rect x="332" y="150" width="60" height="250" rx="14" fill="url(#bar3)" />

  <!-- Trend Curve Line -->
  <path d="M 150 250 Q 256 160 362 130" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  <circle cx="362" cy="130" r="10" fill="#FFFFFF" filter="url(#shadow)" />
</svg>
