name: Build & Package Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔍 TypeScript & Code Validation
        run: npm run lint

      - name: 🏗️ Build Web Assets & Sync Capacitor Android
        run: npm run build:android

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: 🔑 Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./android/gradlew

      - name: 🔨 Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📋 Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/SheetAnalyzer-v1.0.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SheetAnalyzer-v1.0-APK
          path: output/SheetAnalyzer-v1.0.apk
          retention-days: 30
